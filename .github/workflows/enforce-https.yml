name: Enforce HTTPS for SpaansTool
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enforce-https.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  enforce-https:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on HTTPS enforcement
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.request("GET /repos/{owner}/{repo}/pages", { owner, repo });
            core.info("Current Pages settings: " + JSON.stringify({
              html_url: current.data.html_url,
              https_enforced: current.data.https_enforced,
              build_type: current.data.build_type,
              source: current.data.source
            }));
            const updated = await github.request("PUT /repos/{owner}/{repo}/pages", {
              owner, repo, https_enforced: true
            });
            core.info("HTTPS enforcement update request returned: " + updated.status);
